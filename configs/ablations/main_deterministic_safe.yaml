suite_config: configs/ablations/formal_suite.yaml
pdes:
  - darcy
  - poisson
  - helmholtz
  - nsnonbounded
  - burger
  - reaction_diffusion
  - shallow_water
  - heat
  - wave
  - advection_diffusion
  - steady_heat_conduction

# A compact transfer grid for validating the safeguarded deterministic sampler.
# Each main config remains the source of its PDE-specific observation weights.
groups:
  deterministic_safe_single:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      time_grid: uniform
      num_steps: 100
      step_method: euler
    matrix:
      sampler_phase: [stochastic, deterministic]
      deterministic_endpoint_mode: [single_step, single_step]
      deterministic_rollout_checkpoint: [false, false]
      deterministic_bt_mode: [legacy, clipped_zero_at_t0]
      deterministic_guidance_coeff: [1.0, 1.0]
      deterministic_bt_max_scale: [0.1, 0.0125]
      deterministic_guidance_start_ratio: [0.0, 0.02]
      deterministic_guidance_ramp_ratio: [0.0, 0.04]
      deterministic_correction_max_rms: [0.0, 0.02]
      deterministic_numerical_guard: [true, true]
    conditional_overrides:
      poisson_safe_pde_weight:
        when:
          pde: poisson
        set:
          zeta_pde: 30.0

  deterministic_safe_rollout:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      sampler_phase: deterministic
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      time_grid: uniform
      num_steps: 100
      step_method: euler
      deterministic_endpoint_mode: rollout
      deterministic_rollout_checkpoint: true
      deterministic_bt_mode: clipped_zero_at_t0
      deterministic_guidance_coeff: 1.0
      deterministic_bt_max_scale: 0.0125
      deterministic_guidance_start_ratio: 0.02
      deterministic_guidance_ramp_ratio: 0.04
      deterministic_correction_max_rms: 0.02
      deterministic_numerical_guard: true
    conditional_overrides:
      poisson_safe_pde_weight:
        when:
          pde: poisson
        set:
          zeta_pde: 30.0
