# Darcy equation: div(a ∇u) + 1 = 0
# task-specific zeta: forward za=10 zu=40, inverse za=1 zu=2e9, both za=10 zu=40
pde: darcy
task: inverse
data_config_path: configs/main/darcy.yaml
data_path: /large_storage/zhangxf/PDEdata/darcy/darcy_test_10000-128-128.mat
loadby: h5py
coef_name: thresh_a_data
solution_name: thresh_p_data
checkpoint_path: outputs/pretrained/formal/darcy/260625-150746-darcy-batch4-epoch300-accum8-float32/fm4darcy.pth
model_profile: recommended
output_dir: outputs/samples
img_channels: 2
img_resolution: 128
allow_synthetic_data: false
guidance_components: obs_pde
loss_state: endpoint
gradient_target: current_state_chain_rule
sampler_phase: stochastic
switch_ratio: 0.5
guidance_schedule: constant
clip_mode: per_sample_norm
clip_threshold: 10000000000.0
pde_residual_region: full
residual_mode: auto
enforce_boundary_conditions: true
enforce_initial_conditions: true
boundary_condition_mode: dirichlet_zero
initial_condition_mode: none
bc_weight: 1.0
ic_weight: 1.0
endpoint_bc_weight: 1.0
boundary_residual_normalization: sqrt_grid_over_mask
allow_unknown_boundary_conditions: false
legacy_ignore_boundary: false
num_obs: 500
sensor_mode: random
shared_mask: false
mask_seed: 0
noise_level: 0.0
noise_seed: 0
time_grid: uniform
num_steps: 1000
step_method: euler
batch_size: 1
sample_seed: 42
device: cuda
dtype: float32
stochastic_guidance_coeff: 0.1
stochastic_guidance_time: t
zeta_obs_a: 1.0
zeta_obs_u: 2000000000.0
zeta_pde: 1.0
extra:
  det_guidance_stoch_scale: true
