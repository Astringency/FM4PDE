sensor_mode: random
shared_mask: false
mask_seed: 0
noise_level: 0.0
noise_seed: 0
time_grid: uniform
num_steps: 100
step_method: euler
batch_size: 1
sample_seed: 0
device: cpu
dtype: float32
zeta_obs_a: 1
zeta_obs_u: 1
zeta_pde: 1
allow_synthetic_data: false
img_channels: 2
img_resolution: 128
