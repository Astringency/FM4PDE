base_config: configs/ablations/base/poisson_both.yaml
groups:
  loss_state_by_sampler:
    fixed:
      task: both
      guidance_components: obs_pde
      switch_ratio: 0.5
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      time_grid: uniform
      num_steps: 100
      step_method: euler
    product: true
    matrix:
      loss_state: [xt, x_next, endpoint]
      sampler_phase: [deterministic, stochastic]
    conditional_overrides:
      poisson_stochastic_xnext:
        when:
          pde: poisson
          loss_state: x_next
          sampler_phase: stochastic
        set:
          zeta_obs_a: 600000
          zeta_obs_u: 2000000000.0
          zeta_pde: 1.0
