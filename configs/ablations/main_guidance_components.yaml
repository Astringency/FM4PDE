suite_config: configs/ablations/formal_suite.yaml
pdes: [poisson]
groups:
  guidance_components:
    fixed:
      sampler_phase: stochastic
      switch_ratio: 0.5
      loss_state: endpoint
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      time_grid: uniform
      num_steps: 100
      step_method: euler
    product: true
    matrix:
      task: [both, forward, inverse]
      guidance_components: [noguide, obs_only, pde_only, obs_pde]
