base_config: configs/ablations/smoke.yaml
groups:
  sensor_sparsity:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      sensor_mode: per_sample_random
      noise_level: 0.0
    matrix:
      num_obs: [50, 100, 250, 500, 1000]
  sensor_mode:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
    matrix:
      sensor_mode: [random, fixed, grid, sensor_column, per_sample_random]
  noise_robustness:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      sensor_mode: per_sample_random
      num_obs: 500
    matrix:
      noise_level: [0.0, 0.01, 0.05, 0.10]
