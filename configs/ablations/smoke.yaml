pde: poisson
task: forward
data_config_path: configs/main/forward/poisson.yaml
checkpoint_path: outputs/pretrained/fm4poisson.pth
output_dir: outputs/ablations
guidance_components: obs_pde
loss_state: endpoint
sampler_phase: stochastic
switch_ratio: 0.5
guidance_schedule: constant
clip_mode: global_norm
clip_threshold: 10000000000.0
pde_residual_region: full
residual_mode: auto
enforce_boundary_conditions: true
enforce_initial_conditions: true
boundary_condition_mode: dirichlet_zero
initial_condition_mode: none
bc_weight: 1.0
ic_weight: 1.0
endpoint_bc_weight: 1.0
boundary_residual_normalization: sqrt_grid_over_mask
allow_unknown_boundary_conditions: false
legacy_ignore_boundary: false
num_obs: 50
num_sensor_columns: 5
sensor_mode: random
shared_mask: false
mask_seed: 0
noise_level: 0.0
noise_seed: 0
time_grid: uniform
num_steps: 5
step_method: euler
batch_size: 1
sample_seed: 42
device: cpu
dtype: float32
save_intermediate: false
save_plots: false
dry_run: false
zeta_obs_a: 60000
zeta_obs_u: 5000000
zeta_pde: 1
allow_synthetic_data: true
