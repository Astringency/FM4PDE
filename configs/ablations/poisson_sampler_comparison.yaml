suite_config: configs/ablations/formal_suite.yaml
pdes: [poisson]

# One shared sample is evaluated for every task/sampler pair. The server runner
# repeats this 12-job grid for id, smooth, and rough test distributions.
groups:
  poisson_sampler_comparison:
    pdes: [poisson]
    fixed:
      guidance_components: obs_pde
      loss_state: endpoint
      switch_ratio: 0.5
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      time_grid: uniform
      num_steps: 100
      step_method: euler
      deterministic_endpoint_mode: single_step
      deterministic_rollout_checkpoint: false
      deterministic_bt_mode: clipped_zero_at_t0
      deterministic_guidance_coeff: 1.0
      deterministic_bt_max_scale: 0.0125
      deterministic_guidance_start_ratio: 0.02
      deterministic_guidance_ramp_ratio: 0.04
      deterministic_correction_max_rms: 0.02
      deterministic_numerical_guard: true
      # zeta_pde remains task-specific and is inherited from configs/main.
    product: true
    matrix:
      task: [both, forward, inverse]
      sampler_phase: [stochastic, deterministic, hybrid_d2s, hybrid_s2d]
