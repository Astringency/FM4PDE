suite_config: configs/ablations/formal_suite.yaml
pdes: [poisson]
groups:
  time_grid_by_sampler:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      switch_ratio: 0.5
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      num_steps: 100
      step_method: euler
    product: true
    matrix:
      time_grid: [uniform, geometric, cosine]
      sampler_phase: [deterministic, stochastic, hybrid_d2s, hybrid_s2d]
  num_steps_by_sampler:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      switch_ratio: 0.5
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      time_grid: uniform
      step_method: euler
    product: true
    matrix:
      num_steps: [10, 50, 100, 200, 500, 1000, 2000]
      sampler_phase: [deterministic, stochastic, hybrid_d2s, hybrid_s2d]
  step_method_by_sampler:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      switch_ratio: 0.5
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      time_grid: uniform
      num_steps: 100
    product: true
    matrix:
      step_method: [euler, midpoint]
      sampler_phase: [deterministic, stochastic, hybrid_d2s, hybrid_s2d]
