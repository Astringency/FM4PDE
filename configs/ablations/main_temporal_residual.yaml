suite_config: configs/ablations/formal_suite.yaml
pdes: [heat, wave, advection_diffusion, reaction_diffusion, shallow_water, nsnonbounded]
groups:
  temporal_residual_mode:
    fixed:
      task: both
      guidance_components: obs_pde
      loss_state: endpoint
      sampler_phase: stochastic
      switch_ratio: 0.5
      sensor_mode: per_sample_random
      num_obs: 500
      noise_level: 0.0
      time_grid: uniform
      num_steps: 100
      step_method: euler
    matrix:
      residual_mode: [endpoint_secant, hermite_bridge, near_endpoint_temporal]
