data:
  name: 'poisson'
  datapath: '/large_storage/zhangxf/PDEdata/test1125/poisson_test_1000-128-128.mat'
  # datapath: '/large_storage/zhangxf/PDEdata/poisson/poisson_1000-128-128_test.mat'
  remark: 'test'
  # remark: 'train'
  offset: 0
  img_channels: 2
  img_resolution: 128
  obs_size: 500
  coef: f_data
  solution: phi_data
  loadby: 'scipy'

model:
  pre-trained: '/research_data/users/zhangxifeng/C01Python/FM4PDE/output/pretrained/fm4poisson.pth'

generate:
