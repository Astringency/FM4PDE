# Explicit formal training-data manifest.
#
# Every path is relative to --data_path. These names match the default outputs
# of data/DataGen/gen_pde.sh: five training shards with 10,000 samples each.
# Only the entry for the PDE(s) selected by --dataset is resolved and loaded.

