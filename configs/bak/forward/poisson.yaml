# Legacy sparse zeta and losses; 100 steps for comparison with outputs/main.
# Darcy old --lr_decay=True applies obsguide_decay=0.1 to observations every step.
# Masks use the current generator to allow paired evaluation.
pde: poisson
task: forward
test_type: id
data_path: /large_storage/zhangxf/PDEdata/poisson/poisson_test_10000-128-128_id.mat
data_paths:
  id: /large_storage/zhangxf/PDEdata/poisson/poisson_test_10000-128-128_id.mat
  smooth: /large_storage/zhangxf/PDEdata/poisson/poisson_test_10000-128-128_smooth.mat
  rough: /large_storage/zhangxf/PDEdata/poisson/poisson_test_10000-128-128_rough.mat
loadby: scipy
coef_name: f_data
solution_name: phi_data
img_channels: 2
img_resolution: 128
residual_mode: auto
boundary_condition_mode: dirichlet_zero
checkpoint_path: outputs/pretrained/bak/fm4poisson.pth
model_profile: legacy
output_dir: outputs/bak
allow_synthetic_data: false
guidance_components: obs_pde
guidance_operator: legacy
obs_guidance_reduction: legacy_l2_mean
pde_guidance_reduction: legacy_l2_mean
loss_state: endpoint
gradient_target: current_state_chain_rule
sampler_phase: stochastic
guidance_schedule: constant
stochastic_guidance_coeff: 0.2
stochastic_guidance_time: t_next
legacy_obs_multiplier: 1.0
pde_guidance_start_ratio: 0.0
pde_guidance_ramp_ratio: 0.0
clip_mode: none
enforce_boundary_conditions: true
num_obs: 500
sensor_mode: random
shared_mask: false
mask_seed: 0
noise_level: 0.0
noise_seed: 0
time_grid: uniform
num_steps: 100
step_method: euler
batch_size: 1
sample_seed: 42
device: cuda:0
dtype: float32
model_gradient_checkpointing: true
zeta_obs_a: 60000
zeta_obs_u: 0
zeta_pde: 1
